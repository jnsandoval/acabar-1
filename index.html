<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 en linea</title>
    <!-- Enlace CSS de Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <!-- Container limpio, solo centrado y con el ancho ajustado, sin parecer card -->
    <div class="container col-11 col-md-6 col-lg-4 mt-5 mx-auto">
        
        <header class="text-center mb-4">
            <h1 class="h3 fw-bold">Juego 3 en Línea</h1>
        </header>

        <main>

            <!-- Jugador X -->
            <div class="input-group mb-3">

                <div class="input-group-text">

                    <img src="img/x.png" alt="X" width="24" height="24">
                
                </div>

                <input type="text" class="form-control" placeholder="Luis" aria-label="Jugador X">
            
            </div>

            <!-- Jugador O -->
            <div class="input-group mb-4">
                
                <div class="input-group-text">

                    <img src="img/o.png" alt="O" width="24" height="24">
                
                </div>
            
                <input type="text" class="form-control" placeholder="Juan" aria-label="Jugador O">
            
            </div>

            <!-- Boton de Iniciar Juego-->
            <div class="text-center mb-4">

                <button type="button" class="btn btn-outline-dark rounded-pill px-4">Iniciar Juego</button>
            
            </div>

            <!-- Turno-->
            <section class="text-center mb-3">
                
                <h2 class="h5">
                    Turno: 
                </h2>

            </section>
        
        </main>

    </div>

    <!-- Enlace JS de Bootstrap 5.3 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
